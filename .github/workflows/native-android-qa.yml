name: Native Android Developer Preview QA

on:
  pull_request:
    paths:
      - "android-native/**"
      - "tests/native-android-contract.test.mjs"
      - ".github/workflows/native-android-qa.yml"

permissions:
  contents: read

jobs:
  native-android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install complete JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify native security source contracts
        run: node --test tests/native-android-contract.test.mjs
      - name: Compile native debug preview
        working-directory: android-native
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Verify APK artifact
        run: test -s android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Retain temporary non-release debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ai-native-android-preview-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
