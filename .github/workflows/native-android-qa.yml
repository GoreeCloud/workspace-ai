name: Native Android Developer Preview QA

on:
  pull_request:
    paths:
      - "android-native/**"
      - "tests/native-android-contract.test.mjs"
      - ".github/workflows/native-android-qa.yml"

permissions:
  contents: read

jobs:
  native-android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install complete JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36 platform with the preinstalled SDK manager
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk/cmdline-tools"
          manager="$(find "$sdk/cmdline-tools" -maxdepth 5 -type f -name sdkmanager | head -n 1)"
          test -x "$manager"
          export ANDROID_HOME="$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          printf 'y\n%.0s' {1..100} | "$manager" --licenses > /dev/null
          "$manager" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify native security source contracts
        run: node --test tests/native-android-contract.test.mjs
      - name: Compile native debug preview
        working-directory: android-native
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Verify APK artifact
        run: test -s android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Retain temporary non-release debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ai-native-android-preview-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
