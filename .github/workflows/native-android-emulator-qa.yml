name: Native Android Emulator Visual QA

on:
  pull_request:
    paths:
      - "android-native/**"
      - "scripts/native-android-emulator-smoke.py"
      - ".github/workflows/native-android-emulator-qa.yml"

permissions:
  contents: read

jobs:
  native-ui-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up full JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable virtualization for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build, launch and screenshot native screens in isolated Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            cd android-native
            ./gradlew :app:assembleDebug --no-daemon
            cd ..
            python3 scripts/native-android-emulator-smoke.py --apk android-native/app/build/outputs/apk/debug/app-debug.apk --out "$RUNNER_TEMP/native-screen-qa"
      - name: Preserve synthetic visual QA captures for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-synthetic-ui-screenshots
          path: ${{ runner.temp }}/native-screen-qa/*.png
          retention-days: 3
          if-no-files-found: ignore
